name: Backend CI - Pruebas y Cobertura

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Ejecutar pruebas unitarias y medir cobertura
      env:
        SUPABASE_URL: "https://mock.supabase.co"
        SUPABASE_KEY: "mock-key-123"
        DATABASE_URL: "postgresql://usuario:password@localhost:5432/bd_prueba"
      run: |
        python -m pytest --cov=app --cov-report=term-missing